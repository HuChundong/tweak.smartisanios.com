<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · Page not found · LightBoard</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Noto+Serif+SC:wght@600&display=swap">
<style>
  :root { --bg: #0f0b08; --text: #efe6d8; --muted: #9a8a74; --accent: #d6a868; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; text-align: center; padding: 16px;
    background: radial-gradient(50% 60% at 50% 30%, rgba(214,168,104,.16), transparent 70%), var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 600; font-size: clamp(32px, 6vw, 56px); letter-spacing: .1em; margin: 0 0 12px; text-shadow: .06em .08em .14em rgba(0,0,0,.6); }
  p { color: var(--muted); margin: 0 0 28px; }
  a { color: var(--bg); background: #efe4d0; text-decoration: none; padding: 10px 24px; border-radius: 999px; font-weight: 600; }
  p.en { font-family: "EB Garamond", Georgia, serif; font-size: 18px; margin-top: -16px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.ghost { background: transparent; color: var(--text); border: 1px solid rgba(239,230,216,.35); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>这里没有光</h1>
  <p>你要找的页面不存在，或已经移走。</p>
  <p class="en" lang="en">No light here. The page you&rsquo;re looking for doesn&rsquo;t exist or has moved.</p>
  <div class="links"><a href="/">回到首页</a><a href="/en/" lang="en" class="ghost">Back home</a></div>
</main>
</body>
</html>
